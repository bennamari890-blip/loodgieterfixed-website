<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" role="img" aria-labelledby="title desc">
  <title id="title">Loodgieter logo</title>
  <desc id="desc">Strak vectorlogo met donkerblauwe leiding, blauwe letter F en waterdruppel.</desc>

  <defs>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001A33"/>
      <stop offset="1" stop-color="#0B3158"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B7BE8"/>
      <stop offset="1" stop-color="#0669D7"/>
    </linearGradient>
  </defs>

  <!-- Letter F -->
  <path fill="url(#blueGrad)" d="M181 53H272V90H184V121H252V154H184V179H145V90C145 69.6 161.1 53 181 53Z"/>

  <!-- Vertical pipe -->
  <rect x="69" y="53" width="45" height="12" rx="3" fill="url(#pipeGrad)"/>
  <rect x="74" y="62" width="36" height="86" rx="1.5" fill="url(#pipeGrad)"/>
  <rect x="66" y="149" width="51" height="15" rx="3" fill="url(#pipeGrad)"/>

  <!-- Main curved pipe -->
  <path d="M92 164V187C92 200.8 103.2 212 117 212H169C187.2 212 202 226.8 202 245V251"
        fill="none" stroke="url(#pipeGrad)" stroke-width="38" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Coupling details -->
  <rect x="132" y="218" width="17" height="17" rx="3" fill="url(#pipeGrad)"/>
  <rect x="175" y="250" width="46" height="15" rx="3" fill="url(#pipeGrad)"/>

  <!-- Water drop -->
  <path fill="url(#blueGrad)" d="M197 276C197 276 174 307.2 174 322.2C174 335.2 184.3 345 197 345C209.7 345 220 335.2 220 322.2C220 307.2 197 276 197 276Z"/>
</svg>
